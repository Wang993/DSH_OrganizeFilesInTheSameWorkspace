name: Publish to npm

# 事件驱动发布：推送 v* 标签即发布，发布版本号取自 package.json 的 version，
# 且强制校验「标签 == 版本号」，避免发错版本。
# 也可在仓库 Actions 页面手动触发（workflow_dispatch）。
#
# 认证（二选一，workflow 自动适配）：
#   1) 推荐：npm Trusted Publishing (OIDC) —— 在 npmjs.com 包设置里绑定本仓库与本 workflow，
#      无需任何长期密钥（需 npm CLI >= 11.5.1，本 workflow 会自动升级 npm）。
#   2) 备选：在仓库 Secrets 里配置 NPM_TOKEN（Granular Access Token，含发布权限）。
#
# 发版流程：改 package.json 的 version → commit & push → git tag v<version> → push 标签。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# 防止并发发布冲突
concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # Trusted Publishing (OIDC) 所需

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing 需要 npm >= 11.5.1；旧版会直接 ENEEDAUTH
      - name: Upgrade npm for OIDC support
        run: npm install -g npm@latest

      # 认证准备：配了 NPM_TOKEN 就用它；没配则清掉 .npmrc 里的空 token 行，走 OIDC。
      # 注意：不能无条件删 _authToken 行——setup-node 写的正是
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`，无条件删会让 token 失效。
      - name: Configure npm authentication
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "使用 NPM_TOKEN 发布"
          else
            echo "未提供 NPM_TOKEN —— 走 OIDC Trusted Publishing"
            if [ -n "$NPM_CONFIG_USERCONFIG" ] && [ -f "$NPM_CONFIG_USERCONFIG" ]; then
              sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"
            fi
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # 发布前的轻量闸门：两个脚本文件必须语法正确
      - name: Syntax gate
        run: |
          node --check lib/index.js
          node --check lib/organizer.js

      # 标签与版本号一致性校验（手动触发时跳过）
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::标签 $GITHUB_REF_NAME 与 package.json 版本 $VERSION 不一致，请先改版本号再打标签"
            exit 1
          fi
          echo "标签与版本一致：$VERSION"

      # 同版本重复发布会让 workflow 失败，这里提前跳过
      - name: Check if version already published
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/${NAME}/${VERSION}")
          if [ "$CODE" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${NAME}@${VERSION} 已存在于 npm，跳过发布"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "${NAME}@${VERSION} 未发布，开始发布"
          fi

      - name: Publish to npm
        if: steps.check.outputs.exists == 'false'
        run: npm publish --access public --registry https://registry.npmjs.org
        env:
          # 未配置该 secret 时为空，npm 自动走 OIDC（Trusted Publishing）
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
