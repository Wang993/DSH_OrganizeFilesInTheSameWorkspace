# dsh-session-organizer —— DSH bundle patch
# 挂载声明：DSH 启动时按 bundle 层栈叠加本插件的 patch，
# 把「会话整理」插件插入 Web profile 的配置树。
#
# 安装方式（任选其一）：
#   dsh plugin --profile web add link:<本目录绝对路径>
#   或在 profiles/web/package.json 的 dsh.profile.bundles 中手动加入本包名

- insert:
    - id: dsh-session-organizer
      name: dsh-session-organizer
