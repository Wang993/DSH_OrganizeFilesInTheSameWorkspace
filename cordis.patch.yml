# dsh-workspace-organizer —— DSH bundle patch
# 挂载声明：DSH 启动时按 bundle 层栈叠加本插件的 patch，
# 把「会话整理」插件插入 Web profile 的配置树。
#
# 安装方式（任选其一）：
#   dsh plugin --profile web add dsh-workspace-organizer                             # npm（已发布时）
#   dsh plugin --profile web add github:Wang993/DSH_OrganizeFilesInTheSameWorkspace   # 直接从 GitHub
#   dsh plugin --profile web add link:<本目录绝对路径>                                 # 本地开发
#   或在 profiles/web/package.json 的 dsh.profile.bundles 中手动加入本包名

- insert:
    - id: dsh-workspace-organizer
      name: dsh-workspace-organizer
